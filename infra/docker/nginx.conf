# TeamFlow – nginx: statický frontend + reverzní proxy na API (stejný origin,
# takže session cookie je first-party a CORS není potřeba).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 2m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API – bezpečnostní hlavičky nastavuje samotné API (helmet).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Assety s hashem v názvu lze cachovat natrvalo.
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA – všechny ostatní cesty vrací index.html (routing řeší React Router).
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
